name: Dependabot auto-merge

# npm and gomod, patch/minor only.
#
# gomod is safe to auto-merge because build validation is `goreleaser build
# --clean --snapshot` (ci.yml), which never reads the flake, and the vendorHash
# a Go bump invalidates is repaired by vendor-hash.yml after the merge.
# Use RELEASE_TOKEN for the merge so GitHub starts push workflows.
#
# Run from main so the job can read the Actions secret. This workflow only
# reads PR metadata and checks and never checks out the PR or runs its code.
# Release age is handled by dependabot.yml's cooldown.

on:
  pull_request_target:
    branches: [main]

jobs:
  auto-merge:
    name: auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: dependabot-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for required checks
        id: checks
        # For a grouped PR, update-type is the largest bump in the group, so a
        # major sneaking into a group still fails this test.
        # Metadata uses go_modules, while dependabot.yml calls it gomod.
        if: >-
          contains(fromJSON('["npm_and_yarn", "go_modules"]'), steps.meta.outputs.package-ecosystem) &&
          contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.meta.outputs.update-type)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pull_request_target may start before CI registers its check runs.
          for attempt in {1..12}; do
            if gh pr checks "$PR_URL" --required --json name >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          gh pr checks "$PR_URL" --required --watch --fail-fast

      - name: Squash-merge after CI
        if: steps.checks.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Set the Actions secret RELEASE_TOKEN to a Nimbus PAT with Contents: write.'
            exit 1
          fi
          # The REST merge endpoint only needs Contents: write. The head
          # guard ties the merge to the revision whose metadata was checked.
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash -f sha="$HEAD_SHA"

      - name: Report the auto-merge decision
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ELIGIBLE: ${{ contains(fromJSON('["npm_and_yarn", "go_modules"]'), steps.meta.outputs.package-ecosystem) && contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.meta.outputs.update-type) }}
        run: |
          if [[ "$ELIGIBLE" == true ]]; then
            decision="Auto-merged after required CI checks passed."
          else
            decision="Manual merge required: this ecosystem or update type is outside the auto-merge policy."
          fi
          printf '%s\nEcosystem: %s\nUpdate type: %s\n' "$decision" "$ECOSYSTEM" "$UPDATE_TYPE" | tee -a "$GITHUB_STEP_SUMMARY"
