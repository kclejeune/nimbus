name: CI

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
    branches:
      - "main"
  pull_request:
  workflow_dispatch:
    inputs:
      github-hosted:
        description: Use GitHub runners even when NIMBUS_RUNNER is set
        type: boolean
        default: false

# NIMBUS_RUNNER selects the Linux runner for owner-triggered branch CI. Boat's
# public-repository allowlist permits only the owner, so bots and other users,
# fork PRs, release tags, and manual github-hosted runs use GitHub runners.

# Read-only by default; only the release job needs contents: write. pull-requests
# is for golangci-lint's only-new-issues, which reads the PR diff.
permissions:
  contents: read
  pull-requests: read

# Stop superseded branch checks without cancelling a release in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    name: checks
    runs-on: ${{ !inputs.github-hosted && github.ref_type != 'tag' && github.actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.NIMBUS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
          only-new-issues: true
      # The race run executes the full suite, so a second plain run is redundant.
      - name: Go tests (race detector)
        run: go test -race ./...
      - name: Web formatting, types, tests, build, and preview
        run: npm run check
        working-directory: web
      # Snapshot builds report ./VERSION rather than a version derived from the
      # last tag. GoReleaser cross-compiles the Linux and macOS release targets
      # with CGO_ENABLED=0; native macOS builds are unnecessary.
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --clean --snapshot
        env:
          NIMBUS_VERSION: ${{ steps.version.outputs.version }}

  release:
    name: release
    needs: checks
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
